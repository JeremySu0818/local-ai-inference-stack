state_dir: ./state
queue_limit: 1024
max_body_bytes: 67108864
request_timeout_seconds: 3600
models:
- id: google/gemma-4-E4B-it
  command:
  - /bin/bash
  - /home/jeremy/ai/scripts/serve-gemma.sh
  base_url: http://127.0.0.1:8001/v1
  health_path: /health
  endpoints:
  - chat/completions
  - completions
  - embeddings
  startup_timeout_seconds: 900
  stop_timeout_seconds: 30
  idle_ttl_seconds: 10800
- id: Qwen-Image-2.1
  backend: qwen_image
  model_path: ~/.cache/huggingface/downloads/Qwen-Image-2.1/diffusers
  cpu_offload: true
  endpoints:
  - images/generations
  - images/edits
  idle_ttl_seconds: 10800
